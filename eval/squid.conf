# The agent's container reaches the internet only through this proxy, and only the model APIs are allowed.
http_port 3128
acl model_api dstdomain .opencode.ai .openai.com .chatgpt.com models.dev
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow model_api
http_access deny all
cache deny all
