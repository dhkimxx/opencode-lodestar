name: Newest OpenCode

# Every Monday, the smoke test runs against the newest OpenCode, so a release that no longer fits lodestar shows up
# before users hit it. A failure opens an issue, or comments on the one already open.
on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install the newest OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path
      - name: Smoke test
        id: smoke
        run: |
          set -o pipefail
          version="$("$HOME/.opencode/bin/opencode" --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+[^ ]*' | head -n 1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          bun eval/smoke.ts --opencode "$HOME/.opencode/bin/opencode" 2>&1 | tee smoke.txt
      - name: Report the failure in an issue
        if: failure() && steps.smoke.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.smoke.outputs.version }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Smoke test fails on OpenCode $VERSION"
          body="$(printf 'The weekly smoke test failed against OpenCode %s: %s\n\n```\n%s\n```' "$VERSION" "$RUN" "$(grep -E 'FAIL|passed|Failed|^opencode' smoke.txt | head -n 40)")"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
