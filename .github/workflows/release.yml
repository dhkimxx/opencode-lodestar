name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          actual="$(jq -r .version package.json)"
          if [ "$actual" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $actual"
            exit 1
          fi
      - name: Collect release notes from CHANGELOG.md
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "See CHANGELOG.md." > notes.md; fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md $prerelease
