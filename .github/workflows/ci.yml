name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # The OpenCode version lodestar was tested with, as in the README.
  OPENCODE_TESTED: 2.2.5

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in sync with the Bun that built the committed dist/.
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run bundle
      - name: Check that dist/ is up to date
        run: git diff --exit-code -- dist

  # lodestar in a real OpenCode, against a scripted model: no provider, no tokens. See eval/README.md.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Install OpenCode
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --version "$OPENCODE_TESTED" --no-modify-path
      - run: bun eval/smoke.ts --opencode "$HOME/.opencode/bin/opencode"
